<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blocked - Locus</title>
  <link rel="stylesheet" href="styles.css">
  <script src="lib/theme.js"></script>
  <style>
    body { padding: 0; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .wrap { max-width: 560px; width: 100%; padding: 40px 28px; }
    .brand { font-family: "Instrument Serif", serif; font-size: 28px; margin-bottom: 4px; }
    .session-tag { display: inline-block; background: var(--accent-soft); color: #6e4d0a; padding: 4px 10px; border-radius: 999px; font-size: 12px; margin-bottom: 18px; }
    .url { font-family: ui-monospace, "SF Mono", Menlo, monospace; word-break: break-all; color: var(--ink); background: var(--card); border: 1px solid var(--border); padding: 8px 10px; border-radius: 8px; font-size: 13px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions button { flex: 1; }
    details { margin-top: 18px; }
    summary { cursor: pointer; color: var(--ink-soft); font-size: 13px; }
    .verdict { padding: 12px; border-radius: 8px; margin-top: 12px; }
    .verdict.approved { background: #ebf5e7; color: #2c5825; border: 1px solid #c8e0bf; }
    .verdict.denied { background: var(--card); color: var(--ink); border: 1px solid var(--border); }
    .verdict.drift { background: #fff4dc; color: #6e4d0a; border: 1px solid #ecd6a4; }
    .denial-big {
      background: var(--card); color: var(--ink); border: 1px solid var(--border);
      padding: 16px; border-radius: 10px; margin-top: 12px;
    }
    .denial-big h2 { color: var(--ink); margin-bottom: 8px; }
    .denial-big p { color: var(--ink-soft); }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">

    <h1 id="heading">This site isn't on your allowlist.</h1>
    <p>You're focusing on <strong id="taskName"></strong>. <span id="taskLine"></span></p>

    <div id="driftBox" hidden></div>

    <div class="card">
      <label>Blocked URL</label>
      <div class="url" id="urlBox"></div>
    </div>

    <div id="askBox" class="card">
      <label for="reason">Why do you need this site?</label>
      <textarea id="reason" placeholder="e.g. I need to look up a formula for my math homework."></textarea>
      <div class="actions">
        <button class="primary" id="submitBtn">Ask the AI</button>
        <button id="backBtn">Go back</button>
      </div>
      <div id="status"></div>
    </div>

    <div id="lockedBox" class="denial-big" hidden>
      <h2>The AI denied this request.</h2>
      <p id="lockedReason"></p>
      <p><strong>Go back and try a different site, or use an override code.</strong></p>
      <div class="actions">
        <button id="lockedBack">Go back</button>
      </div>
    </div>

    <details>
      <summary>I have an override code</summary>
      <div class="card" style="margin-top: 8px;">
        <label for="code">Override code</label>
        <input type="password" id="code" autocomplete="off" placeholder="Enter your override code">
        <div class="actions">
          <button id="overrideBtn">Override</button>
        </div>
        <div id="overrideStatus"></div>
      </div>
    </details>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
