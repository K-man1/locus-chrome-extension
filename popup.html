<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Locus</title>
  <link rel="stylesheet" href="styles.css">
  <script src="lib/theme.js"></script>
  <style>
    body { width: 320px; padding: 18px 16px; max-height: 520px; overflow-y: auto; }
    .lock-icon {
      width: 44px; height: 44px; margin: 0 auto 6px;
      border: 1.5px solid var(--ink); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--ink);
    }
    .lock-icon svg { width: 22px; height: 22px; }
    .brand-block { text-align: center; margin-bottom: 16px; }
    .brand { font-family: var(--serif); font-size: 30px; line-height: 1; letter-spacing: -0.01em; }
    .subtitle { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
    .label-uc { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }
    .timer { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 28px; color: var(--ink); text-align: center; }
    .task-line { font-size: 13px; color: var(--ink); margin-top: 6px; word-break: break-word; text-align: center; }
    .footer { margin-top: 14px; font-size: 12px; text-align: center; }
    .session-summary { margin-top: 8px; font-size: 11px; color: var(--ink-soft); text-align: center; }
    .timer-block { text-align: center; padding: 6px 0 4px; }
    .start-btn { width: 100%; margin-top: 10px; padding: 10px; font-size: 14px; font-weight: 600; }
    .start-btn .play { margin-right: 4px; }
    .or-link { display: block; text-align: center; margin-top: 10px; font-size: 11px; color: var(--ink-soft); }
    .pomo-phase { font-size: 11px; color: var(--ink-soft); text-align: center; margin-top: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
    .pomo-phase.break { color: var(--accent); }
    .active-actions { display: flex; gap: 8px; }
    .active-actions button { flex: 1; }
    .lock-panel { margin-top: 12px; }
    .lock-note {
      font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--accent); text-align: center; margin-bottom: 10px;
    }
    .lock-tasks { display: flex; flex-direction: column; gap: 6px; }
    .lock-tasks button {
      width: 100%; text-align: left; padding: 9px 12px; font-size: 13px;
      border: 1px solid var(--line, #ddd); border-radius: 8px;
      background: transparent; color: var(--ink); cursor: pointer;
    }
    .lock-tasks button.current {
      border-color: var(--ink); font-weight: 600; cursor: default;
    }
    .lock-tasks button.current::before { content: "● "; color: var(--accent); }
  </style>
</head>
<body>
  <div id="idle">
    <div class="brand-block">
      <div class="lock-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="9" rx="2"></rect>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
        </svg>
      </div>
      <div class="brand">Locus</div>
      <div class="subtitle">What do you want to focus on?</div>
    </div>

    <div class="label-uc">What are you working on?</div>
    <input type="text" id="taskInput" placeholder="e.g. Write essay intro" autofocus>
    <button class="primary start-btn" id="startBtn"><span class="play">▶</span> Start Session</button>
    <a href="#" id="openDashUpcoming" class="or-link">OR pick from calendar →</a>
  </div>

  <div id="active" style="display:none">
    <div class="brand-block">
      <div class="lock-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="9" rx="2"></rect>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
        </svg>
      </div>
      <div class="brand">Locus</div>
    </div>
    <div class="card">
      <div class="timer-block">
        <div class="timer" id="timer">00:00</div>
        <div class="pomo-phase" id="pomoPhase" style="display:none"></div>
      </div>
      <div class="task-line" id="taskLine"></div>
      <div class="session-summary" id="sessionSummary"></div>
    </div>
    <div class="lock-panel" id="lockPanel" style="display:none">
      <div class="lock-note" id="lockNote"></div>
      <div class="label-uc">Focus on</div>
      <div class="lock-tasks" id="lockTasks"></div>
    </div>
    <div class="active-actions" id="activeActions">
      <button id="pauseBtn">Pause</button>
      <button class="danger" id="stopBtn">End Session</button>
    </div>
  </div>

  <div class="footer">
    <a href="#" id="openDash">Open dashboard</a>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
