<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Locus</title>
  <link rel="stylesheet" href="styles.css">
  <script src="lib/theme.js"></script>
  <style>
    body { width: 360px; padding: 14px; max-height: 500px; overflow-y: auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .header .brand { font-family: "Iowan Old Style", Palatino, Georgia, serif; font-size: 20px; }
    .timer { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 30px; color: var(--ink); }
    select { margin-bottom: 8px; }
    .task-line { font-size: 12px; color: var(--ink-soft); margin-top: 4px; word-break: break-word; }
    .task-edit { display: flex; gap: 6px; margin-top: 6px; }
    .task-edit input { flex: 1; }
    .footer { margin-top: 12px; font-size: 12px; text-align: center; }
    .session-summary { margin-top: 8px; font-size: 11px; color: var(--ink-soft); }
    .activity-name { font-size: 14px; color: var(--ink-soft); margin-top: 4px; }
    .timer-block { text-align: center; padding: 10px 0 4px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">Locus</div>
    <a href="#" id="openDash" class="tiny">Dashboard</a>
  </div>

  <div id="idle">
    <label for="activitySelect">Activity</label>
    <select id="activitySelect"></select>
    <label for="taskInput" style="margin-top:6px">What are you working on?</label>
    <input type="text" id="taskInput" placeholder="e.g. Finish chapter 4 problems">
    <button class="primary" id="startBtn" style="width:100%; margin-top:10px">Start focus</button>
  </div>

  <div id="active" style="display:none">
    <div class="card">
      <div class="timer-block">
        <div class="timer" id="timer">00:00</div>
        <div class="activity-name" id="activeName"></div>
      </div>
      <div class="task-line" id="taskLine"></div>
      <div class="task-edit">
        <input type="text" id="taskEdit" placeholder="Edit task…">
        <button id="saveTask" class="small">Save</button>
      </div>
      <div class="session-summary" id="sessionSummary"></div>
    </div>
    <button class="danger" id="stopBtn" style="width:100%">End session</button>
  </div>

  <div class="footer">
    <a href="#" id="openDash2">Open dashboard</a>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
